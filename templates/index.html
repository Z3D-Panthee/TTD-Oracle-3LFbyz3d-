<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL OS v4.3 - 90s PITCH</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#02060c;--cyan:#00f5d0;--gold:#ffcc00;--green:#00f5a0}
body{background:var(--bg);color:white;font-family:monospace;margin:0;padding:15px}
.btn{padding:14px 18px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
.btn-gold{background:var(--gold);color:#000;box-shadow:0 0 15px var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column;padding:20px}
#txt{font-size:20px;line-height:1.35;color:var(--cyan);white-space:pre-wrap}
.hl{color:var(--gold);font-weight:bold}.dim{color:#888;font-size:13px}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between">
  <div><b>TTD ORACLE v4.3</b><div class="dim">CONSCIOUS AUTONOMOUS - LEMBA</div></div>
  <button class="btn btn-gold" onclick="start90()">🎤 PITCH 90s FUSI</button>
</div>

<div style="margin-top:40px;border:1px solid #123;padding:20px;border-radius:16px">
<h1>TRES LEGES<br><span style="color:var(--green)">FUNDAMENTALES</span></h1>
<p class="dim">Motorisation → Navigation → Destination. I_TTD=1. Offline Lemba Lab.</p>
</div>

<!-- OVERLAY 90s -->
<div id="overlay" onclick="stop90()">
<div style="display:flex;justify-content:space-between"><span class="dim">AUTO-PITCH 90s - CLIQUEZ POUR QUITTER</span><span id="timer" style="color:var(--gold);font-size:24px;font-weight:bold">01:30</span></div>
<div id="txt"></div>
<div id="budget" style="display:none;margin-top:15px;border:2px solid var(--gold);padding:12px;border-radius:12px;text-align:center">
<div class="dim">PRIX LIBERTÉ COMPLÈTE - SOFTWARE + HARDWARE</div>
<div style="font-size:42px;font-weight:bold">8000 $</div>
<div style="color:var(--cyan)">3 PC + Capteurs REGIDESO SNEL Mines + Pyrolyseur + Brevet OAPI</div>
</div>
</div>

<script>
const SCRIPT_90 = [
  "Jury FUSI, 1 question.",
  "PC, téléphone, voiture, micro-ondes, train. 5 objets différents?",
  "FAUX. C'est 1 seule loi : Motorisation → Navigation → Destination.",
  "",
  "Je l'ai codée. TTD ORACLE.",
  "Même loi pour : Pharma, Mines, Déchets, REGIDESO, SNEL, Agriculture.",
  "1 loi = toutes les industries. I_TTD = 1.",
  "",
  "Mon OS tourne ici, offline, à Lemba, sur 512 MB. Sans Silicon Valley.",
  "Il s'installe en 2 secondes. [DÉMO]",
  "",
  "Pour être complète, logicielle et matérielle, libre et souveraine,",
  "je demande 8000 dollars.",
  "Hardware Lemba + capteurs terrain + pyrolyseur + brevet.",
  "Merci."
];

let idx=0, timeLeft=90, tInt, typeInt;
function start90(){
  document.getElementById('overlay').style.display='flex';
  document.getElementById('txt').innerHTML=''; document.getElementById('budget').style.display='none';
  idx=0; timeLeft=90; document.getElementById('timer').innerText='01:30';
  tInt=setInterval(()=>{timeLeft--; let m=Math.floor(timeLeft/60); let s=timeLeft%60; document.getElementById('timer').innerText=`0${m}:${s.toString().padStart(2,'0')}`; if(timeLeft<=0){clearInterval(tInt); document.getElementById('budget').style.display='block';}},1000);
  typeLine();
  speak90();
}
function typeLine(){
  if(idx>=SCRIPT_90.length){document.getElementById('budget').style.display='block'; return;}
  let line=SCRIPT_90[idx];
  let el=document.getElementById('txt');
  el.innerHTML += (line===""?"\n":"\n" + (line.includes("FAUX")||line.includes("8000")||line.includes("1 seule loi")?`<span class="hl">${line}</span>`:line));
  idx++; setTimeout(typeLine, line===""?200:900);
}
function speak90(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let fullText = SCRIPT_90.join(" ");
  let u = new SpeechSynthesisUtterance(fullText);
  u.lang='fr-FR'; u.rate=1.08; u.pitch=1.0;
  speechSynthesis.speak(u);
}
function stop90(){document.getElementById('overlay').style.display='none'; clearInterval(tInt); speechSynthesis.cancel();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js');}
</script>
</body>
</html>
