<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTINEL OS v5.9 - FINAL</title>
<meta name="theme-color" content="#00ff88">
<style>
*{box-sizing:border-box;font-family:monospace}
body{margin:0;background:#000;color:#cde9de;padding:12px}
.card{background:#0a1f18;border:1px solid #16412e;border-radius:16px;padding:16px;margin:10px 0}
.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:900;margin:4px;cursor:pointer}
.btn-yellow{background:#ffcc00;color:#000}
.btn-green{background:#00ff88;color:#000}
.progress{height:6px;background:#0e2a1f;border-radius:999px;overflow:hidden;margin:8px 0}
.progress div{height:100%;width:0%;background:#00ff88;transition:width.3s linear}
.timer{font-size:1.6rem;color:#ffcc00;font-weight:900}
.stream{white-space:pre-wrap;line-height:1.6;color:#00f5d0;min-height:100px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0">SENTINEL OS v5.9 <span style="color:#00ff88">FINAL AUDIO</span></h2>
<div style="font-size:.7rem;opacity:.6">Même moteur que agrosentinelles-demo - MP3 direct - Timer indépendant</div>
<div style="margin:10px 0">
<button class="btn btn-yellow" onclick="start(30)">🎤 30s CHOC</button>
<button class="btn btn-yellow" onclick="start(60)">🎤 60s PREUVE</button>
<button class="btn btn-yellow" onclick="start(90)">🎤 90s SOUVERAIN</button>
<button class="btn btn-green" onclick="stopAll()">■ STOP</button>
</div>
<div class="progress"><div id="bar"></div></div>
<div style="display:flex;justify-content:space-between"><span class="timer" id="timer">00:00</span><span id="pct">0%</span></div>
<div class="stream" id="stream">Clique 30s CHOC. Timer doit tourner même sans son. Si timer tourne, audio va suivre.</div>
<audio id="a" controls style="width:100%;margin-top:8px"></audio>
</div>
<script>
const TEXTS={
30:`Chers membres du jury. A Lemba quand internet coupe tout s arrete. J ai refuse ca. Je suis Sentinel OS. Dans votre poche. Offline. Souverain. Verolis Kinshasa.`,
60:`A Lemba on m a dit pas d internet pas d IA. Faux. J ai cree Sentinel OS. Triade Dynamique. Action energie. Navigation boussole. Destination M etoile point fixe I TTD egale un. Offline. Kinshasa invente le futur.`,
90:`Monsieur le President jury FUSI. On vend la dependance. A Lemba nous choisissons la souverainete. Je suis Sentinel OS Theorie Triade Dynamique. Pour Regideso Snel universite meme loi. Un Action. Deux Navigation. Trois Destination M etoile point fixe entropie nulle I TTD egale un. Offline sur terminal simple. Sentinel agit et stabilise. Verolis Sarl intelligence congolaise pour le monde. Merci.`
};
let t=null;let audio=document.getElementById('a');
function stopAll(){clearInterval(t);audio.pause();document.getElementById('bar').style.width='0%';document.getElementById('timer').textContent='00:00';document.getElementById('pct').textContent='0%';}
function start(sec){
 stopAll();
 const txt=TEXTS[sec];
 const stream=document.getElementById('stream');
 const bar=document.getElementById('bar');
 const timer=document.getElementById('timer');
 const pct=document.getElementById('pct');
 let e=0;
 // TIMER INDEPENDANT - tourne même si audio bloque
 t=setInterval(()=>{
  e++;const p=Math.min(1,e/sec);
  stream.textContent=txt.slice(0,Math.floor(p*txt.length));
  bar.style.width=(p*100)+'%';
  pct.textContent=Math.floor(p*100)+'%';
  timer.textContent=`00:${String(Math.max(0,sec-e)).padStart(2,'0')}`;
  if(e>=sec){clearInterval(t);stream.textContent=txt;}
 },1000);
 // AUDIO MP3 - même technique que agrosentinelles-demo.onrender.com
 const url=`https://translate.google.com/translate_tts?ie=UTF-8&tl=fr-FR&client=tw-ob&q=${encodeURIComponent(txt)}`;
 audio.src=url;
 audio.play().catch(()=>{
  // Fallback si Google bloque: speechSynthesis direct
  const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u);
 });
}
</script>
</body>
</html>
