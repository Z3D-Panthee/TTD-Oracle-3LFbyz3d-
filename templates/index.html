<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b07">
<title>SENTINEL OS v9.2 ANDROID</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiU0VOVElORUwgT1MgdjkuMiIsInNob3J0X25hbWUiOiJTRU5USU5FTCIsInN0YXJ0X3VybCI6Ii8_dj05LjIiLCJkaXNwbGF5IjoiZnVsbHNjcmVlbiIsIm9yaWVudGF0aW9uIjoicG9ydHJhaXQiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzAyMDkwNyIsInRoZW1lX2NvbG9yIjoiIzAyMGIwNyJ9">
<style>
:root{--g:#00ff88;--y:#ffd43b;--bg:#020907;--b:#1d5239;--t:#d7f5e8;--u:#78a995}
*{box-sizing:border-box;font-family:monospace}
body{margin:0;background:var(--bg);color:var(--t)}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020907;transition:.6s}
#splash.h{opacity:0;pointer-events:none}
.logo{width:90px;height:90px;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--y));display:grid;place-items:center;font-size:2.6rem}
.bar{width:160px;height:4px;background:#082217;border-radius:99px;overflow:hidden;margin-top:18px}
.pr{width:0%;height:100%;background:var(--g);animation:l 2.2s forwards}
@keyframes l{to{width:100%}}
.card{background:#0c2117;border:1px solid var(--b);border-radius:18px;padding:14px;margin:10px}
.btn{border:0;border-radius:999px;padding:10px 13px;font-weight:900;margin:3px}
.y{background:var(--y);color:#000}.g{background:var(--g);color:#000}.o{background:transparent;border:1px solid var(--b);color:#a9e9ca}
.stream{min-height:100px;padding:10px;border-left:2px solid var(--g);white-space:pre-wrap;color:#00f5d0}
</style>
</head>
<body>
<div id="splash">
<div class="logo">🇨🇩</div>
<div style="margin-top:12px;font-weight:900">SENTINEL OS v9.2</div>
<div style="color:var(--u);font-size:.6rem">VEROLIS SARL • DANY TSHISELEKA</div>
<div class="bar"><div class="pr"></div></div>
</div>
<div style="padding:14px;max-width:980px;margin:auto">
<div class="card">
<h1 style="font-size:2.6rem;line-height:.9">SENTINEL<br><span style="color:var(--g)">OS v9.2</span></h1>
<p>v9.2 Android App • Splash 🇨🇩 • Plein écran • Historique local</p>
<button class="btn y" onclick="startPitch(30)">🎤 30s</button>
<button class="btn y" onclick="startPitch(60)">🎤 60s</button>
<button class="btn y" onclick="startPitch(90)">🎤 90s SOUVERAIN</button>
<button class="btn g" onclick="openJury()">⚖️ JURY</button>
<button class="btn o" onclick="toggleFS()">⛶ Plein écran</button>
<div id="vs" style="font-size:.6rem;color:var(--u);margin-top:8px">Touchez 1 fois = débloqué • 1 clic suffit</div>
<div id="bar" style="height:6px;background:#082217;border-radius:99px;margin:8px 0"><div id="prog" style="width:0%;height:100%;background:var(--g)"></div></div>
<div id="timer" style="color:var(--y);font-weight:900">00:00</div>
<div id="stream" class="stream">Prêt. Version légère acceptée par GitHub Mobile. Historique local actif.</div>
<div style="margin-top:8px">
<button class="btn o" onclick="exportApp()">📦 Exporter</button>
<button class="btn o" onclick="showHist()">📜 Historique (<span id="hc">0</span>)</button>
</div>
</div>
<div class="card" id="jury" style="display:none">
<div id="qb"></div>
<div id="jq" style="font-weight:900;margin:10px 0"></div>
<div id="ja" style="padding:10px;border-left:3px solid var(--y);background:rgba(255,212,59,.05)"></div>
<button class="btn y" onclick="nextQ()">Suivante</button>
<button class="btn o" onclick="speak()">🔊 Parler</button>
<button class="btn o" onclick="saveHist()">💾 Sauver</button>
</div>
<div id="histPanel" style="display:none" class="card">
<h3>📜 Historique</h3>
<div id="histList"></div>
<button class="btn o" onclick="document.getElementById('histPanel').style.display='none'">Fermer</button>
<button class="btn o" onclick="localStorage.clear();location.reload()">Effacer</button>
</div>
</div>
<script>
const DATA={
fr:{
p:{
30:"Membres du jury. A Lemba quand internet coupe tout s'arrete. Sentinel OS refuse cela. Intelligence souveraine offline.",
60:"On dit qu'une IA exige la Silicon Valley. Faux. A Lemba j'ai bati Sentinel OS sur Action Navigation Destination M etoile I_TTD egal un.",
90:"Monsieur le President membres du jury FUSI. On nous vend la dependance. A Lemba nous avons choisi la souverainete. Je suis Sentinel OS v9.2 Android App ne de la Triade Dynamique. Action Navigation Destination M etoile point fixe ou I_TTD egale un. Verolis Sarl intelligence congolaise. Merci."
},
q:["C'est quoi TTD?","Pourquoi local?","Vs ChatGPT?","Business?","Pourquoi Afrique?"],
a:["TTD=Action Navigation Destination invariant 1.","Local=continue sans internet.","ChatGPT cloud generaliste Sentinel souverain offline.","Licence Verolis + install.","Afrique=souverainete."]
}
};
let state={ok:false,t:null,e:0,h:JSON.parse(localStorage.getItem('s9')||'[]'),qi:0,cur:""};
const sy=window.speechSynthesis;
let fv=null;
function loadV(){const vs=sy.getVoices();if(vs.length)fv=vs.find(v=>v.lang.startsWith('fr'))||vs[0];}
loadV();sy.onvoiceschanged=loadV;
function prime(){if(state.ok) return;try{sy.cancel();const u=new SpeechSynthesisUtterance(' ');u.volume=0.01;sy.speak(u);state.ok=true;document.getElementById('vs').textContent='🔊 Débloqué • 1 clic suffit';}catch(e){}}
document.addEventListener('touchstart',prime,{once:true});document.addEventListener('click',prime,{once:true});
window.addEventListener('load',()=>{setTimeout(()=>{document.getElementById('splash').classList.add('h');},2200);updateHC();});
function updateHC(){document.getElementById('hc').textContent=state.h.length;}
function startPitch(sec){
prime();
const run=()=>{
clearInterval(state.t);state.e=0;
const txt=DATA.fr.p[sec];
const st=document.getElementById('stream');
const prog=document.getElementById('prog');
const tm=document.getElementById('timer');
st.textContent='';prog.style.width='0%';
const u=new SpeechSynthesisUtterance(txt);
u.lang='fr-FR';if(fv) u.voice=fv;u.rate=0.9;
let ka=setInterval(()=>{if(sy.speaking){sy.pause();sy.resume();}},3000);
u.onend=()=>clearInterval(ka);
sy.speak(u);
state.t=setInterval(()=>{
state.e++;
const pr=Math.min(1,state.e/sec);
st.textContent=txt.slice(0,Math.floor(pr*txt.length));
prog.style.width=(pr*100)+'%';
tm.textContent='00:'+String(Math.max(0,sec-state.e)).padStart(2,'0');
if(state.e>=sec){clearInterval(state.t);st.textContent=txt;save('PITCH_'+sec,txt);}
},1000);
};
if(state.ok) run(); else setTimeout(run,350);
}
function openJury(){const p=document.getElementById('jury');p.style.display='block';const qb=document.getElementById('qb');qb.innerHTML='';DATA.fr.q.forEach((q,i)=>{const b=document.createElement('button');b.className='btn o';b.textContent=q;b.onclick=()=>showQ(i);qb.appendChild(b);});showQ(0);}
function showQ(i){state.qi=i;document.getElementById('jq').textContent=DATA.fr.q[i];document.getElementById('ja').textContent=DATA.fr.a[i];state.cur=DATA.fr.a[i];}
function nextQ(){showQ((state.qi+1)%DATA.fr.q.length);}
function speak(){prime();const u=new SpeechSynthesisUtterance(state.cur);u.lang='fr-FR';if(fv) u.voice=fv;sy.cancel();setTimeout(()=>sy.speak(u),80);}
function save(type,content){state.h.unshift({id:Date.now(),type,content});localStorage.setItem('s9',JSON.stringify(state.h));updateHC();}
function saveHist(){save('JURY_Q'+(state.qi+1),document.getElementById('jq').textContent+' | '+document.getElementById('ja').textContent);alert('💾 Sauvé');}
function showHist(){document.getElementById('histPanel').style.display='block';const l=document.getElementById('histList');l.innerHTML='';state.h.forEach(h=>{const d=document.createElement('div');d.style.cssText='padding:8px;border:1px solid #1d5239;border-radius:8px;margin:4px 0;background:#081811';d.textContent=new Date(h.id).toLocaleString()+' • '+h.type+' • '+h.content.slice(0,120);l.appendChild(d);});}
function toggleFS(){try{if(!document.fullscreenElement) document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
function exportApp(){const h=document.documentElement.outerHTML;const b=new Blob([h],{type:'text/html'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='SENTINEL_v9.2.html';a.click();}
if('serviceWorker' in navigator){const sw="self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});";navigator.serviceWorker.register('data:text/javascript;base64,'+btoa(sw));}
</script>
</body>
</html>
